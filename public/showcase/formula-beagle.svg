<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hallBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3d2f1f"/>
      <stop offset="60%" stop-color="#1f1810"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a25a"/>
      <stop offset="50%" stop-color="#e8c984"/>
      <stop offset="100%" stop-color="#9a7d3e"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#hallBg)"/>

  <!-- gothic arches in background -->
  <g opacity="0.45" stroke="#5a4628" stroke-width="2" fill="none">
    <path d="M280 200 Q280 100 380 100 Q480 100 480 200 L480 600 L280 600 Z"/>
    <path d="M520 180 Q520 80 620 80 Q720 80 720 180 L720 600 L520 600 Z"/>
    <path d="M700 90 Q700 -10 780 -10 Q780 -10 780 90"/>
    <path d="M770 130 Q770 50 850 50 Q930 50 930 130 L930 600 L770 600 Z"/>
    <path d="M970 180 Q970 80 1070 80 Q1170 80 1170 180 L1170 600 L970 600 Z"/>

    <!-- pillars -->
    <line x1="200" y1="200" x2="200" y2="700" stroke-width="3"/>
    <line x1="1200" y1="200" x2="1200" y2="700" stroke-width="3"/>
    <line x1="100" y1="220" x2="100" y2="700" stroke-width="2"/>
    <line x1="1300" y1="220" x2="1300" y2="700" stroke-width="2"/>

    <!-- floor -->
    <line x1="0" y1="700" x2="1400" y2="700" stroke-width="1"/>
    <line x1="100" y1="750" x2="1300" y2="750" stroke-width="0.5"/>
  </g>

  <!-- decorative gold frame -->
  <g fill="none" stroke="url(#goldFrame)" stroke-width="1.5" opacity="0.75">
    <rect x="60" y="60" width="1280" height="780"/>
    <rect x="78" y="78" width="1244" height="744"/>
    <!-- corner ornaments -->
    <circle cx="78" cy="78" r="8" stroke-width="1.2"/>
    <circle cx="1322" cy="78" r="8" stroke-width="1.2"/>
    <circle cx="78" cy="822" r="8" stroke-width="1.2"/>
    <circle cx="1322" cy="822" r="8" stroke-width="1.2"/>
  </g>

  <!-- Beagle dog body silhouette -->
  <g transform="translate(700, 480)">
    <!-- body -->
    <ellipse cx="0" cy="120" rx="160" ry="180" fill="#f5e4c6"/>
    <ellipse cx="-40" cy="90" rx="130" ry="160" fill="#1a1410"/>
    <!-- tail -->
    <ellipse cx="170" cy="20" rx="22" ry="80" transform="rotate(20 170 20)" fill="#f5e4c6"/>
    <circle cx="180" cy="-40" r="20" fill="#f5e4c6"/>
    <!-- head -->
    <ellipse cx="0" cy="-90" rx="115" ry="120" fill="#f5e4c6"/>
    <!-- ears -->
    <ellipse cx="-95" cy="-90" rx="42" ry="90" transform="rotate(-15 -95 -90)" fill="#8a5028"/>
    <ellipse cx="95" cy="-100" rx="38" ry="85" transform="rotate(20 95 -100)" fill="#8a5028"/>
    <!-- snout -->
    <ellipse cx="0" cy="-50" rx="55" ry="50" fill="#fff"/>
    <ellipse cx="0" cy="-72" rx="22" ry="16" fill="#1a0e08"/>
    <!-- eyes -->
    <ellipse cx="-35" cy="-115" rx="14" ry="16" fill="#3d2918"/>
    <ellipse cx="35" cy="-115" rx="14" ry="16" fill="#3d2918"/>
    <circle cx="-32" cy="-118" r="4" fill="#fff"/>
    <circle cx="38" cy="-118" r="4" fill="#fff"/>
    <!-- mouth/tongue -->
    <path d="M-15 -45 Q0 -32 15 -45 Q10 -25 0 -22 Q-10 -25 -15 -45 Z" fill="#d96d6d"/>
    <!-- tiny tooth -->
    <rect x="-3" y="-46" width="3" height="6" fill="#fff"/>

    <!-- collar -->
    <rect x="-70" y="20" width="140" height="22" fill="#5a4628" rx="3"/>
    <circle cx="0" cy="32" r="14" fill="url(#goldFrame)"/>
    <text y="37" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="16" font-weight="700" fill="#3a2410">B</text>

    <!-- witch hat -->
    <g>
      <ellipse cx="0" cy="-185" rx="135" ry="22" fill="#1a1410"/>
      <path d="M-65 -185 L-20 -330 Q-15 -340 0 -342 Q15 -340 20 -330 L75 -185 Z" fill="#1a1410"/>
      <path d="M-65 -190 L65 -190 L60 -200 L-60 -200 Z" fill="#1a1410"/>
      <!-- buckle -->
      <rect x="-22" y="-220" width="44" height="22" fill="#1a1410" stroke="#c4a25a" stroke-width="3"/>
      <rect x="-12" y="-218" width="24" height="18" fill="none" stroke="#c4a25a" stroke-width="1.5"/>
    </g>
  </g>

  <!-- magical orbit circle behind -->
  <g opacity="0.25" stroke="#c4a25a" fill="none" stroke-width="1">
    <circle cx="700" cy="450" r="320"/>
    <circle cx="700" cy="450" r="290" stroke-dasharray="2 8"/>
  </g>

  <!-- title plaque -->
  <g transform="translate(700, 720)" text-anchor="middle">
    <rect x="-220" y="-50" width="440" height="100" fill="#1a1410" stroke="url(#goldFrame)" stroke-width="2"/>
    <text y="-2" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="700" font-size="58" fill="#f0e0b8">Fórmula</text>
    <g transform="translate(0, 35)">
      <rect x="-110" y="-15" width="220" height="30" fill="url(#goldFrame)"/>
      <text y="6" font-family="Cormorant Garamond, serif" font-style="italic" font-size="20" fill="#1a1410" font-weight="500">de encantar e vender</text>
    </g>
  </g>

  <!-- corner meta -->
  <g transform="translate(95, 110)">
    <text font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" fill="#c4a25a" opacity="0.75" letter-spacing="3">FÓRMULA BEAGLE · 2023</text>
  </g>
  <g transform="translate(1305, 110)" text-anchor="end">
    <text font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" fill="#c4a25a" opacity="0.75" letter-spacing="3">PET · LIFESTYLE</text>
  </g>
</svg>
