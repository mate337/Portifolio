<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="pimaBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f6f4ef"/>
      <stop offset="100%" stop-color="#e8e3d8"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#pimaBg)"/>

  <!-- subtle vertical grid lines -->
  <g opacity="0.06">
    <line x1="100" y1="0" x2="100" y2="900" stroke="#1c1a17" stroke-width="0.5"/>
    <line x1="1300" y1="0" x2="1300" y2="900" stroke="#1c1a17" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1400" y2="100" stroke="#1c1a17" stroke-width="0.5"/>
    <line x1="0" y1="800" x2="1400" y2="800" stroke="#1c1a17" stroke-width="0.5"/>
  </g>

  <!-- corner markers -->
  <g transform="translate(60, 80)">
    <text font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#1c1a17" opacity="0.55" letter-spacing="4">PIMA · LOGOTIPO</text>
    <text y="22" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#8b6f47" opacity="0.7" letter-spacing="4">2024</text>
  </g>
  <g transform="translate(1340, 80)" text-anchor="end">
    <text font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#1c1a17" opacity="0.55" letter-spacing="4">BRANDING · IDENTIDADE</text>
  </g>

  <!-- main wordmark — mix of geometric Pi/a + serif italic iM -->
  <g transform="translate(700, 460)" text-anchor="middle">
    <!-- Composite logotype recreated with mixed weights -->
    <text font-family="Inter, sans-serif" font-weight="900" font-size="220" fill="#1c1a17" letter-spacing="-12">
      <tspan>P</tspan><tspan font-family="Cormorant Garamond, serif" font-weight="500" font-style="italic" font-size="200" dy="6">i</tspan><tspan dy="-6">M</tspan><tspan font-family="Cormorant Garamond, serif" font-weight="500" font-style="italic" font-size="180" dy="-4">a</tspan><tspan font-family="Inter, sans-serif" font-weight="900" font-size="220" dy="4" dx="-10">.</tspan>
    </text>

    <!-- tagline -->
    <g transform="translate(0, 100)">
      <text font-family="Inter, sans-serif" font-weight="300" font-size="22" fill="#1c1a17" letter-spacing="6">
        O  <tspan font-family="Cormorant Garamond, serif" font-style="italic" font-weight="500">melhor</tspan>  e ponto.
      </text>
    </g>
  </g>

  <!-- bottom byline -->
  <g transform="translate(60, 830)">
    <text font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#1c1a17" opacity="0.45" letter-spacing="4">DIREÇÃO DE ARTE · MARTINS STUDIO</text>
  </g>
  <g transform="translate(1340, 830)" text-anchor="end">
    <text font-family="Cormorant Garamond, serif" font-style="italic" font-weight="500" font-size="18" fill="#8b6f47" opacity="0.7">— Sistema autoral</text>
  </g>
</svg>
